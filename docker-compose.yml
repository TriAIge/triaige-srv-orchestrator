services:

  # ── triaige-srv-orchestrator ───────────────────────────────────────────────
  # Sem LocalStack: SQS/S3 apontam para recursos AWS reais (provisionados via Terraform em
  # triaige-infra), configurados via AWS_* no .env. Deixe AWS_SQS_ENDPOINT/AWS_S3_ENDPOINT em
  # branco para usar os endpoints reais da região configurada. Credenciais: AWS_ACCESS_KEY_ID/
  # AWS_SECRET_ACCESS_KEY/AWS_SESSION_TOKEN no .env (se preenchidos) OU o profile "default" do
  # ~/.aws/credentials do host, montado abaixo — útil para credenciais de laboratório que
  # expiram com frequência: basta atualizar ~/.aws/credentials no host e rodar
  # `docker compose restart srv-orchestrator`, sem tocar no .env.
  srv-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: triaige-srv-orchestrator
    restart: unless-stopped
    volumes:
      - ${HOME}/.aws:/home/appuser/.aws:ro
    environment:
      DB_URL: jdbc:mysql://host.docker.internal:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      AWS_SQS_ENDPOINT: ${AWS_SQS_ENDPOINT}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      RAW_DOCUMENTS_BUCKET: ${RAW_DOCUMENTS_BUCKET}
      CURATED_DOCUMENTS_BUCKET: ${CURATED_DOCUMENTS_BUCKET}
      DOCS_RECEIVED_QUEUE_URL: ${DOCS_RECEIVED_QUEUE_URL}
      DOCS_PREPROCESSING_QUEUE_URL: ${DOCS_PREPROCESSING_QUEUE_URL}
      RESULTS_READY_QUEUE_URL: ${RESULTS_READY_QUEUE_URL}
      # Shared secret do callback do triaige-srv-mcp-ai (POST .../mcp-result). Deve ser o
      # mesmo valor configurado em MCP_INTERNAL_TOKEN no .env do triaige-srv-mcp-ai.
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN}
      # Fase 4: client Orchestrator -> mcp-ai. host.docker.internal porque o mcp-ai roda
      # num compose/rede Docker separado deste — só é alcançável pela porta publicada no
      # host (mesma convenção já usada por ORCHESTRATOR_BASE_URL no compose do mcp-ai).
      MCP_AI_BASE_URL: ${MCP_AI_BASE_URL}
      MCP_ANALYZE_TOKEN: ${MCP_ANALYZE_TOKEN}
    ports:
      - "${SRV_ORCHESTRATOR_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
