spring:
  application:
    name: triaige-srv-orchestrator

  # Configurações sensíveis (buckets, filas, credenciais de banco) ficam fora deste
  # repositório, em um arquivo por ambiente (ex: application-prod.yml) no projeto
  # triaige-srv-orchestrator-config. O import é opcional: se o diretório/arquivo
  # não existir (ex: ambiente local sem o repo clonado ao lado), os valores padrão
  # definidos abaixo continuam valendo.
  config:
    import: "optional:file:${CONFIG_REPO_PATH:../triaige-srv-orchestrator-config/}"

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/triaige_srv_orchestrator?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:triaige}
    password: ${DB_PASSWORD:triaige}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

orchestrator:
  base-path: /api/orchestrator/v1
  idempotency:
    ttl-hours: 24
  presign:
    upload-url-ttl-minutes: 15
  internal:
    mcp-callback-token: ${MCP_INTERNAL_TOKEN:dev-local-internal-token}

aws:
  region: ${AWS_REGION:us-east-1}
  sqs:
    endpoint: ${AWS_SQS_ENDPOINT:}
    docs-received-queue-url: ${DOCS_RECEIVED_QUEUE_URL:http://localhost:4566/000000000000/triaige-docs-received}
    docs-preprocessing-queue-url: ${DOCS_PREPROCESSING_QUEUE_URL:http://localhost:4566/000000000000/triaige-docs-preprocessing}
    q1-consumer:
      enabled: ${Q1_CONSUMER_ENABLED:true}
      poll-interval-ms: ${Q1_POLL_INTERVAL_MS:5000}
      wait-time-seconds: ${Q1_WAIT_TIME_SECONDS:10}
      max-messages: ${Q1_MAX_MESSAGES:10}
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
    raw-documents-bucket: ${RAW_DOCUMENTS_BUCKET:bucket-triaige-raw-certificacoes}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  cloudwatch:
    metrics:
      export:
        enabled: ${CLOUDWATCH_METRICS_ENABLED:false}
        namespace: Triaige/Orchestrator
        step: 1m

logging:
  level:
    br.com.triaige: ${LOG_LEVEL:INFO}
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
